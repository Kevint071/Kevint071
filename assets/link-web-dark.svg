<svg xmlns="http://www.w3.org/2000/svg" width="40" height="136" viewBox="0 0 40 136" role="img" aria-label="Ver la demo">
  <style>
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .a{opacity:0;animation:in .6s cubic-bezier(.2,.7,.2,1) both}
    .d{transform-origin:left center;transform-box:fill-box;animation:draw .9s cubic-bezier(.2,.7,.2,1) both}
    @media (prefers-reduced-motion:reduce){.a,.d{animation:none;opacity:1}}
  </style>
  <g class="a" style="animation-delay:.4s">
    <rect x="4.5" y="13.5" width="31" height="31" rx="6" fill="#161b22" stroke="#30363d"/>
    <g transform="translate(12 21)" color="#e6edf3"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x=".65" y="1.65" width="14.7" height="12.7" rx="2"/><path d="M.65 5.35h14.7"/><path d="m6.5 7.8 3.2 2.1-3.2 2.1z" fill="currentColor"/></g><circle cx="3" cy="3.5" r=".7" fill="currentColor"/><circle cx="5.2" cy="3.5" r=".7" fill="currentColor"/></g>
  </g>
  <rect class="d" x="-780" y="135" width="820" height="1" fill="#30363d" style="animation-delay:.1s"/>
</svg>
