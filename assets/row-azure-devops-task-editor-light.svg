    <rect class="bx1" x="24" y="39" width="8" height="8" rx="2" fill="#0969da" opacity="0"/>
    <path class="ck1" d="M25.6 43l2 2 3-4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dashoffset="9"/>
    <rect x="37" y="41" width="11" height="4" rx="2" fill="#c4ccd4"/>
    <rect class="pl" x="55" y="40" width="9" height="6" rx="3" fill="#c4ccd4"/>
    <rect x="24" y="51" width="8" height="8" rx="2" fill="none" stroke="#8c959f" stroke-width="1.2"/>
    <rect class="bx2" x="24" y="51" width="8" height="8" rx="2" fill="#0969da" opacity="0"/>
    <path class="ck2" d="M25.6 55l2 2 3-4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dashoffset="9"/>
    <rect x="37" y="53" width="13" height="4" rx="2" fill="#c4ccd4"/>
    <rect class="pl" x="55" y="52" width="9" height="6" rx="3" fill="#c4ccd4"/>
    </g>
  </g>
  <text class="a" x="100" y="34" font-size="16" font-weight="600" fill="#1f2328" style="animation-delay:.15s">azure-devops-task-editor</text>
  <text class="a" x="100" y="58" font-size="14" fill="#59636e" style="animation-delay:.25s">Edita en lote las Tasks hijas de un PBI: estado, responsable y horas de varias a la vez,</text>
  <text class="a" x="100" y="78" font-size="14" fill="#59636e" style="animation-delay:.32s">sin abrir cada Work Item. El token va en cookies httpOnly, fuera del alcance del cliente.</text>
  <g class="a" style="animation-delay:0.50s"><rect x="100.5" y="92.5" width="75" height="24" rx="4" fill="none" stroke="#d1d9e0"/><text class="m" x="138" y="108.5" font-size="13" fill="#59636e" text-anchor="middle">Next.js</text></g>
  <g class="a" style="animation-delay:0.57s"><rect x="183.5" y="92.5" width="98" height="24" rx="4" fill="none" stroke="#d1d9e0"/><text class="m" x="232.5" y="108.5" font-size="13" fill="#59636e" text-anchor="middle">TypeScript</text></g>
  <g class="a" style="animation-delay:0.64s"><rect x="289.5" y="92.5" width="114" height="24" rx="4" fill="none" stroke="#d1d9e0"/><text class="m" x="346.5" y="108.5" font-size="13" fill="#59636e" text-anchor="middle">Azure DevOps</text></g>
  <rect class="d" x="0" y="135" width="820" height="1" fill="#d1d9e0" style="animation-delay:.1s"/>
