    <path class="ck0" d="M25.6 31l2 2 3-4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dashoffset="9"/>
    <rect x="37" y="29" width="14" height="4" rx="2" fill="#c4ccd4"/>
    <rect class="pl" x="55" y="28" width="9" height="6" rx="3" fill="#c4ccd4"/>
