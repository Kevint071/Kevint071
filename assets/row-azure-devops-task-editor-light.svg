<svg xmlns="http://www.w3.org/2000/svg" width="740" height="136" viewBox="0 0 740 136" role="img" aria-label="azure-devops-task-editor: Edita en lote las Tasks hijas de un PBI: estado, responsable y horas de varias a la vez, sin abrir cada Work Item. El token va en cookies httpOnly, fuera del alcance del cliente. Next.js, TypeScript, Azure DevOps.">
  <style>
    text{font-family:-apple-system, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .a{opacity:0;animation:in .6s cubic-bezier(.2,.7,.2,1) both}
    .d{transform-origin:left center;transform-box:fill-box;animation:draw .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes ck0{0%{stroke-dashoffset:9}8%{stroke-dashoffset:9}14%{stroke-dashoffset:0}88%{stroke-dashoffset:0}94%{stroke-dashoffset:9}100%{stroke-dashoffset:9}}@keyframes bx0{0%{opacity:0}8%{opacity:0}14%{opacity:1}88%{opacity:1}94%{opacity:0}100%{opacity:0}}.ck0{stroke-dasharray:9;animation:ck0 7s cubic-bezier(.2,.7,.2,1) infinite}.bx0{animation:bx0 7s cubic-bezier(.2,.7,.2,1) infinite}@keyframes ck1{0%{stroke-dashoffset:9}20%{stroke-dashoffset:9}26%{stroke-dashoffset:0}88%{stroke-dashoffset:0}94%{stroke-dashoffset:9}100%{stroke-dashoffset:9}}@keyframes bx1{0%{opacity:0}20%{opacity:0}26%{opacity:1}88%{opacity:1}94%{opacity:0}100%{opacity:0}}.ck1{stroke-dasharray:9;animation:ck1 7s cubic-bezier(.2,.7,.2,1) infinite}.bx1{animation:bx1 7s cubic-bezier(.2,.7,.2,1) infinite}@keyframes ck2{0%{stroke-dashoffset:9}32%{stroke-dashoffset:9}38%{stroke-dashoffset:0}88%{stroke-dashoffset:0}94%{stroke-dashoffset:9}100%{stroke-dashoffset:9}}@keyframes bx2{0%{opacity:0}32%{opacity:0}38%{opacity:1}88%{opacity:1}94%{opacity:0}100%{opacity:0}}.ck2{stroke-dasharray:9;animation:ck2 7s cubic-bezier(.2,.7,.2,1) infinite}.bx2{animation:bx2 7s cubic-bezier(.2,.7,.2,1) infinite}@keyframes pl{0%{fill:#c4ccd4}50%{fill:#c4ccd4}57%{fill:#0969da}88%{fill:#0969da}95%{fill:#c4ccd4}100%{fill:#c4ccd4}}.pl{animation:pl 7s cubic-bezier(.2,.7,.2,1) infinite}
    @media (prefers-reduced-motion:reduce){.a,.d{animation:none}.glyph *{animation-play-state:paused!important;animation-delay:-4.2s!important}.a,.d{animation:none;opacity:1}}
  </style>
  <g class="a" style="animation-delay:.05s" transform="translate(0 20)">
    <rect x=".5" y=".5" width="71" height="71" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <g class="glyph">
    <rect x="12" y="12" width="34" height="5" rx="2.5" fill="#0969da"/>
    <path d="M15 19V55M15 31h6M15 43h6M15 55h6" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
