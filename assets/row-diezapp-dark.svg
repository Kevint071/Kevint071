<svg xmlns="http://www.w3.org/2000/svg" width="740" height="136" viewBox="0 0 740 136" role="img" aria-label="DiezApp + Diezapp-api: App local para calcular diezmos: reparte un monto neto, guarda el historial, resume por mes y exporta a PDF. Su API hace de proxy OAuth para conectar con Google Drive. Python, Flet, SQLite, Next.js (API).">
  <style>
    text{font-family:-apple-system, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .a{opacity:0;animation:in .6s cubic-bezier(.2,.7,.2,1) both}
    .d{transform-origin:left center;transform-box:fill-box;animation:draw .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes sg0{0%{stroke-dasharray:0 119.38}6%{stroke-dasharray:0 119.38}21%{stroke-dasharray:28.65 119.38}88%{stroke-dasharray:28.65 119.38}95%{stroke-dasharray:0 119.38}100%{stroke-dasharray:0 119.38}}.sg0{animation:sg0 6.5s cubic-bezier(.2,.7,.2,1) infinite}@keyframes sg1{0%{stroke-dasharray:0 119.38}23%{stroke-dasharray:0 119.38}38%{stroke-dasharray:42.98 119.38}88%{stroke-dasharray:42.98 119.38}95%{stroke-dasharray:0 119.38}100%{stroke-dasharray:0 119.38}}.sg1{animation:sg1 6.5s cubic-bezier(.2,.7,.2,1) infinite}@keyframes sg2{0%{stroke-dasharray:0 119.38}40%{stroke-dasharray:0 119.38}55%{stroke-dasharray:47.75 119.38}88%{stroke-dasharray:47.75 119.38}95%{stroke-dasharray:0 119.38}100%{stroke-dasharray:0 119.38}}.sg2{animation:sg2 6.5s cubic-bezier(.2,.7,.2,1) infinite}
    @media (prefers-reduced-motion:reduce){.a,.d{animation:none}.glyph *{animation-play-state:paused!important;animation-delay:-4.2s!important}.a,.d{animation:none;opacity:1}}
  </style>
  <g class="a" style="animation-delay:.05s" transform="translate(0 20)">
    <rect x=".5" y=".5" width="71" height="71" rx="8" fill="#161b22" stroke="#30363d"/>
    <g class="glyph">
    <g transform="rotate(-90 36 36)" fill="none" stroke-width="8">
    <circle class="sg0" cx="36" cy="36" r="19" stroke="#58a6ff" stroke-dasharray="0 119.38" stroke-dashoffset="0.00"/>
    <circle class="sg1" cx="36" cy="36" r="19" stroke="#6e7681" stroke-dasharray="0 119.38" stroke-dashoffset="-28.65"/>
    <circle class="sg2" cx="36" cy="36" r="19" stroke="#3d444d" stroke-dasharray="0 119.38" stroke-dashoffset="-71.63"/>
    </g>
    <text class="m" x="36" y="40.5" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">%</text>
    </g>
  </g>
  <text class="a" x="100" y="34" font-size="16" font-weight="600" fill="#e6edf3" style="animation-delay:.15s">DiezApp + Diezapp-api</text>
  <text class="a" x="100" y="58" font-size="14" fill="#8b949e" style="animation-delay:.25s">App local para calcular diezmos: reparte un monto neto, guarda el historial, resume por mes</text>
  <text class="a" x="100" y="78" font-size="14" fill="#8b949e" style="animation-delay:.32s">y exporta a PDF. Su API hace de proxy OAuth para conectar con Google Drive.</text>
  <g class="a" style="animation-delay:0.50s"><rect x="100.5" y="92.5" width="67" height="24" rx="4" fill="none" stroke="#30363d"/><text class="m" x="134" y="108.5" font-size="13" fill="#8b949e" text-anchor="middle">Python</text></g>
  <g class="a" style="animation-delay:0.57s"><rect x="175.5" y="92.5" width="51" height="24" rx="4" fill="none" stroke="#30363d"/><text class="m" x="201" y="108.5" font-size="13" fill="#8b949e" text-anchor="middle">Flet</text></g>
  <g class="a" style="animation-delay:0.64s"><rect x="234.5" y="92.5" width="67" height="24" rx="4" fill="none" stroke="#30363d"/><text class="m" x="268" y="108.5" font-size="13" fill="#8b949e" text-anchor="middle">SQLite</text></g>
  <g class="a" style="animation-delay:0.71s"><rect x="309.5" y="92.5" width="121" height="24" rx="4" fill="none" stroke="#30363d"/><text class="m" x="370" y="108.5" font-size="13" fill="#8b949e" text-anchor="middle">Next.js (API)</text></g>
  <rect class="d" x="0" y="135" width="820" height="1" fill="#30363d" style="animation-delay:.1s"/>
</svg>
