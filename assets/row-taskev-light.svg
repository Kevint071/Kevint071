<svg xmlns="http://www.w3.org/2000/svg" width="740" height="136" viewBox="0 0 740 136" role="img" aria-label="Taskev: Gestor de tareas pensado para responder qué toca hacer ahora: ordena por prioridad y progreso, y separa lo que vence hoy, lo atrasado y lo bloqueado. Next.js, React, TypeScript, PostgreSQL.">
  <style>
